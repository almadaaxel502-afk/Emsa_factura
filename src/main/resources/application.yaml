spring:
  application:
    name: emsa
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/emsa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Spring Security: desactivamos el login HTTP automático
# La autenticación se maneja desde la UI JavaFX
server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: WARN
