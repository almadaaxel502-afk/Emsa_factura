version: "3.9"

services:
  mysql:
    image: mysql:8.3
    container_name: emsa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root          # application.yaml usa root/root
      MYSQL_DATABASE: emsa
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - emsa_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  emsa_mysql_data:
